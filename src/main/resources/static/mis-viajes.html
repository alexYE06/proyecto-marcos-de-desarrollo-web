<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Viajes y Perfil - UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <header class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand fw-bold text-white fs-4">
                <i class="bi bi-bus-front text-warning"></i> Urban<span class="text-warning">Ride</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-warning btn-sm rounded-pill px-3 fw-bold">
                    <i class="bi bi-search"></i> Comprar nuevo pasaje
                </a>
                <button type="button" class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnCerrarSesionCliente">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <div class="row g-4">
            <!-- Columna Perfil -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 rounded-4 shadow-sm p-4">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4" style="width: 52px; height: 52px;">
                            <i class="bi bi-person-check-fill"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0" id="perfilNombreTitulo">Mi Cuenta</h5>
                            <span class="badge bg-dark text-warning" id="perfilRolBadge">CLIENTE</span>
                        </div>
                    </div>

                    <form id="formActualizarPerfil">
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-muted mb-1">Nombres</label>
                            <input type="text" class="form-control form-control-sm rounded-3" id="perf-nombre" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-muted mb-1">Apellidos</label>
                            <input type="text" class="form-control form-control-sm rounded-3" id="perf-apellido" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold text-muted mb-1">Documento / Correo</label>
                            <input type="text" class="form-control form-control-sm rounded-3 bg-light" id="perf-doc-correo" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted mb-1">Teléfono</label>
                            <input type="tel" class="form-control form-control-sm rounded-3" id="perf-telefono">
                        </div>

                        <hr>
                        <div class="small fw-bold text-muted mb-2">Cambiar contraseña (opcional)</div>
                        <input type="password" class="form-control form-control-sm rounded-3 mb-2" id="perf-pass-actual" placeholder="Contraseña actual">
                        <input type="password" class="form-control form-control-sm rounded-3 mb-3" id="perf-pass-nueva" placeholder="Nueva contraseña (mín. 6)">

                        <div id="mensajePerfil" class="small fw-bold mb-2"></div>
                        <button type="submit" class="btn btn-primary btn-sm w-100 rounded-pill fw-bold py-2">
                            Guardar cambios de perfil
                        </button>
                    </form>
                </div>
            </div>

            <!-- Columna Historial de Viajes y Boletos QR -->
            <div class="col-12 col-lg-8">
                <div class="card border-0 rounded-4 shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h4 class="fw-bold mb-0"><i class="bi bi-ticket-perforated text-warning"></i> Mis Compras y Boletos QR</h4>
                            <small class="text-muted">Historial sincronizado en tiempo real desde PostgreSQL</small>
                        </div>
                        <button type="button" class="btn btn-outline-dark btn-sm rounded-pill px-3" id="btnRecargarCompras">
                            <i class="bi bi-arrow-clockwise"></i> Actualizar
                        </button>
                    </div>

                    <div id="contenedorMisCompras">
                        <div class="text-center text-muted py-4">Cargando tus viajes...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/mis-viajes.js"></script>
</body>
</html>
