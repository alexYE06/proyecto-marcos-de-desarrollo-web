<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Digital de Salidas (Thymeleaf SSR) - UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <a th:href="@{/}" class="navbar-brand fw-bold text-white fs-4 mb-0">
                <i class="bi bi-bus-front text-warning"></i> Urban<span class="text-warning">Ride</span>
                <span class="badge bg-warning text-dark ms-2 fs-6">CARTELERA EN VIVO</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white-50 small d-none d-md-inline" th:text="'Actualizado: ' + ${actualizadoEn}"></span>
                <a th:href="@{/}" class="btn btn-outline-warning btn-sm rounded-pill px-3 fw-bold">
                    <i class="bi bi-arrow-left"></i> Volver al Buscador
                </a>
            </div>
        </div>
    </header>

    <main class="container py-4 flex-grow-1">
        <div class="card border-0 rounded-4 shadow-sm p-4 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-7">
                    <h4 class="fw-bold mb-1"><i class="bi bi-broadcast text-primary"></i> Tablero Electrónico de Salidas Programadas</h4>
                    <p class="text-muted small mb-0">Vista renderizada desde el servidor con <strong>Thymeleaf + Spring Data JPA</strong>.</p>
                </div>
                <div class="col-12 col-md-5">
                    <form method="get" th:action="@{/cartelera}" class="d-flex gap-2">
                        <select name="origen" class="form-select rounded-pill bg-light">
                            <option value="">Todas las ciudades de origen</option>
                            <option th:each="ciu : ${ciudades}"
                                    th:value="${ciu}"
                                    th:text="${ciu}"
                                    th:selected="${ciu == origenSeleccionado}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Filtrar</button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(salidas)}" class="alert alert-info rounded-4 p-4 text-center">
            No se encontraron salidas activas para el filtro seleccionado.
        </div>

        <div th:unless="${#lists.isEmpty(salidas)}" class="card border-0 rounded-4 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Salida</th>
                            <th>Origen → Destino</th>
                            <th>Servicio / Unidad</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Libres</th>
                            <th class="text-end">Tarifa Base</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${salidas}">
                            <td class="fw-bold font-monospace" th:text="${#temporals.format(v.fechaHoraSalida, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <div class="fw-bold text-primary" th:text="${v.ruta.origen.ciudad + ' → ' + v.ruta.destino.ciudad}"></div>
                                <small class="text-muted" th:text="${v.ruta.origen.nombre + ' a ' + v.ruta.destino.nombre}"></small>
                            </td>
                            <td>
                                <div class="fw-semibold" th:text="${v.servicio}"></div>
                                <small class="text-muted" th:text="${v.bus != null ? 'Placa ' + v.bus.placa + ' · ' + v.bus.modelo : 'Doble Piso'}"></small>
                            </td>
                            <td class="text-center">
                                <span class="badge"
                                      th:classappend="${v.estado == 'EMBARCANDO'} ? 'bg-warning text-dark' : (${v.estado == 'EN_RUTA'} ? 'bg-info text-dark' : 'bg-primary')"
                                      th:text="${v.estado}"></span>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-success-subtle text-success fs-6" th:text="${v.asientosDisponibles + ' libres'}"></span>
                            </td>
                            <td class="text-end fw-bold" th:text="${'S/ ' + #numbers.formatDecimal(v.precio, 1, 2)}"></td>
                            <td class="text-center">
                                <button type="button" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold"
                                        th:attr="data-ir-viaje=${v.idViaje}">
                                    Comprar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: piePagina}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { obtenerSesion } from './js/core/session.js';
        document.querySelectorAll('[data-ir-viaje]').forEach(btn => {
            btn.addEventListener('click', () => {
                sessionStorage.setItem('viajeSeleccionadoId', btn.dataset.irViaje);
                window.location.href = obtenerSesion() ? 'asientos.html' : '/?login=1';
            });
        });
    </script>
</body>
</html>
