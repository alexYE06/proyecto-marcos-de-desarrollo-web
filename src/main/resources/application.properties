server.port=${SERVER_PORT:8080}

# Conexión a PostgreSQL (configurable por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_terminal}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:lafiru123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Migración segura de tablas y columnas nuevas sin destruir datos existentes
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuración Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Clave secreta HMAC-SHA256 para firma de tokens JWT (RFC 7519)
security.jwt.secret=${JWT_SECRET:UrbanRidePeru2026ClaveSecretaJwtHmacSha256SeguridadWebUTP!}
security.jwt.expiration-hours=${JWT_EXP_HOURS:8}
